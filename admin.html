<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Mary (Gerenciamento)</title>
    <style>
        :root {
            --primary: #c2185b;
            --primary-dark: #880e4f;
            --primary-light: #fce4ec;
            --bg-color: #fcf6f7;
            --text-main: #2d2d2d;
            --text-muted: #666;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
        }

        .wrapper {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary-dark);
            margin: 0 0 5px 0;
            font-size: 24px;
        }

        .card-box {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(194, 24, 91, 0.06);
            margin-bottom: 20px;
            border: 1px solid rgba(248, 187, 208, 0.4);
        }

        label {
            font-weight: 600;
            color: var(--primary-dark);
            font-size: 14px;
            display: block;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            background-color: var(--white);
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
        }

        .btn {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(194, 24, 91, 0.2);
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn-success { background-color: #27ae60; }
        .btn-success:hover { background-color: #219653; }
        .btn-secondary { background-color: #880e4f; }

        .client-info-box {
            background: var(--primary-light);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }

        .message {
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>Painel da Mary 🔒</h1>
            <p>Gerenciamento de Clientes e Fidelidade</p>
        </header>

        <div class="card-box">
            <label for="cliente-select">Selecione a Cliente:</label>
            <select id="cliente-select" onchange="mudarClienteAdmin()">
                <!-- Preenchido via JS -->
            </select>

            <div class="client-info-box">
                <div style="font-size: 14px; color: var(--text-muted);">Cliente Ativa:</div>
                <div id="adm-nome" style="font-size: 18px; font-weight: 700; color: var(--primary-dark);">Nome</div>
                <div id="adm-tel" style="font-size: 13px; color: var(--text-muted);">Tel</div>
                <div style="font-size: 26px; font-weight: 800; color: var(--primary); margin-top: 5px;"><span id="adm-pontos">0</span> / 50 pts</div>
            </div>

            <button class="btn btn-success" onclick="cadastrarClienteAdmin()">+ Cadastrar Nova Cliente</button>
            <button class="btn" onclick="adicionarPontosAdmin()">Registrar Atendimento (+5 pts)</button>
            <button class="btn btn-secondary" onclick="registrarIndicacaoAdmin()">Indicação Premiada (+5 pts para ambos)</button>

            <div class="message" id="adm-msg"></div>
        </div>
    </div>

    <script>
        // Carrega a base salva ou cria uma inicial se estiver vazia
        function obterClientes() {
            let dados = localStorage.getItem('baseClientesMary');
            if (dados) {
                return JSON.parse(dados);
            } else {
                let inicial = [
                    { nome: "Mariana", telefone: "11988881111", pontos: 15 },
                    { nome: "Juliana Silva", telefone: "11977772222", pontos: 10 },
                    { nome: "Camila Souza", telefone: "11966663333", pontos: 25 }
                ];
                localStorage.setItem('baseClientesMary', JSON.stringify(inicial));
                return inicial;
            }
        }

        function salvarClientes(lista) {
            localStorage.setItem('baseClientesMary', JSON.stringify(lista));
        }

        let listaAdmin = obterClientes();
        let indexAdmin = 0;

        function carregarSelectAdmin() {
            listaAdmin = obterClientes();
            const select = document.getElementById("cliente-select");
            select.innerHTML = "";
            
            if (listaAdmin.length === 0) {
                select.innerHTML = "<option>Nenhuma cliente cadastrada</option>";
                return;
            }

            listaAdmin.forEach((cli, i) => {
                let opt = document.createElement("option");
                opt.value = i;
                opt.innerText = `${cli.nome} - ${cli.telefone} (${cli.pontos} pts)`;
                if (i === indexAdmin) opt.selected = true;
                select.appendChild(opt);
            });
            atualizarPainelAdmin();
        }

        function mudarClienteAdmin() {
            indexAdmin = parseInt(document.getElementById("cliente-select").value);
            atualizarPainelAdmin();
        }

        function atualizarPainelAdmin() {
            if (listaAdmin.length === 0) return;
            let cli = listaAdmin[indexAdmin];
            document.getElementById("adm-nome").innerText = cli.nome;
            document.getElementById("adm-tel").innerText = cli.telefone;
            document.getElementById("adm-pontos").innerText = cli.pontos;
        }

        function cadastrarClienteAdmin() {
            let nome = prompt("Nome da nova cliente:");
            if (!nome || nome.trim() === "") return;
            let tel = prompt("Telefone / WhatsApp (somente números ou com DDD):") || "11000000000";
            
            // Limpa o telefone para salvar apenas números
            let telLimpo = tel.replace(/\D/g, '');

            listaAdmin.push({ nome: nome.trim(), telefone: telLimpo, pontos: 0 });
            salvarClientes(listaAdmin);
            indexAdmin = listaAdmin.length - 1;
            carregarSelectAdmin();

            document.getElementById("adm-msg").style.color = "#27ae60";
            document.getElementById("adm-msg").innerText = `✅ Cliente ${nome} cadastrada com sucesso!`;
        }

        function adicionarPontosAdmin() {
            if (listaAdmin.length === 0) return;
            let cli = listaAdmin[indexAdmin];
            if (cli.pontos + 5 > 50) {
                document.getElementById("adm-msg").style.color = "#c0392b";
                document.getElementById("adm-msg").innerText = "❌ Atingiria o teto máximo de 50 pontos!";
                return;
            }
            cli.pontos += 5;
            salvarClientes(listaAdmin);
            atualizarPainelAdmin();
            carregarSelectAdmin();
            document.getElementById("adm-msg").style.color = "#c2185b";
            document.getElementById("adm-msg").innerText = `🎉 +5 pontos adicionados para ${cli.nome}!`;
        }

        function registrarIndicacaoAdmin() {
            if (listaAdmin.length === 0) return;
            let nomeInd = prompt("Nome da pessoa indicada:");
            if (!nomeInd || nomeInd.trim() === "") return;
            let telInd = prompt("Telefone da indicada (somente números):") || "11000000000";
            let telIndLimpo = telInd.replace(/\D/g, '');

            let cli = listaAdmin[indexAdmin];
            if (cli.pontos + 5 > 50) {
                document.getElementById("adm-msg").style.color = "#c0392b";
                document.getElementById("adm-msg").innerText = "❌ A cliente que indicou já está no teto de 50 pontos!";
                return;
            }

            cli.pontos += 5; 
            listaAdmin.push({ nome: nomeInd.trim(), telefone: telIndLimpo, pontos: 5 }); 

            salvarClientes(listaAdmin);
            indexAdmin = listaAdmin.length - 1;
            carregarSelectAdmin();

            document.getElementById("adm-msg").style.color = "#c2185b";
            document.getElementById("adm-msg").innerText = `🤝 Indicação cadastrada! ${cli.nome} ganhou +5 pts e ${nomeInd} entrou com 5 pts.`;
        }

        carregarSelectAdmin();
    </script>

</body>
</html>
