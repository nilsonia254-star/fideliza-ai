<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Designer Estilo Mary</title>
    <style>
        :root { --primary: #c2185b; --primary-dark: #880e4f; --bg-color: #fcf6f7; --white: #ffffff; --success: #2e7d32; --warning: #f57c00; }
        body { font-family: sans-serif; background: var(--bg-color); margin: 0; padding: 20px 15px; }
        .wrapper { max-width: 480px; margin: 0 auto; }
        .card { background: var(--white); border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; margin-bottom: 10px; }
        .btn { background: var(--primary); color: var(--white); border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-success { background: var(--success); }
        .btn-secondary { background: #5c6bc0; }
        .btn-warning { background: var(--warning); }
        .alerta-indicacao { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; display: none; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1 style="text-align: center; color: var(--primary-dark);">Painel da Mary 🔒</h1>
        
        <div id="aviso-indicacao" class="alerta-indicacao"></div>

        <div class="card">
            <select id="cliente-selecao" onchange="mudarClienteAdmin()">
                <option value="">Selecione uma cliente...</option>
            </select>
        </div>

        <div class="card">
            <div id="nome-adm" style="font-size: 18px; font-weight: bold; color: var(--primary-dark);">-</div>
            <div id="tel-adm" style="font-size: 13px; color: #666">-</div>
            <div id="pontos-adm" style="font-size: 26px; font-weight: bold; color: var(--primary); margin-top: 5px;">0 / 50 pts</div>
        </div>

        <button class="btn btn-success" onclick="abrirCadastro()">+ Cadastrar Cliente</button>
        <button class="btn" onclick="registrarAtendimento()">Registrar Atendimento (+5 pts)</button>
        <button class="btn btn-secondary" onclick="registrarIndicacaoManual()">Indicação Manual (+5 pts)</button>
        <button class="btn btn-warning" onclick="resgatarPontos()">🎁 Resgatar Pontos</button>
        <button class="btn" style="background: #00897b;" onclick="enviarWhatsApp()">📲 Enviar Link</button>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('mary_clientes_v2')) || [];

        // Verifica se abriu o painel a partir de um link de indicação de cliente
        const urlParams = new URLSearchParams(window.location.search);
        const indicadoPor = urlParams.get('indicadoPor');

        if (indicadoPor) {
            let aviso = document.getElementById('aviso-indicacao');
            aviso.style.display = 'block';
            aviso.innerHTML = `✨ Nova cliente veio por indicação de: <b>${decodeURIComponent(indicadoPor)}</b>! Cadastre-a abaixo para creditar os pontos de ambas.`;
        }

        function calcularPontosValidos(historico) {
            let limite60Dias = Date.now() - (60 * 24 * 60 * 60 * 1000);
            return historico.filter(r => r.data >= limite60Dias).reduce((acc, r) => acc + r.pontos, 0);
        }

        function atualizarSelect() {
            let select = document.getElementById('cliente-selecao');
            let atual = select.value;
            select.innerHTML = '<option value="">Selecione uma cliente...</option>';
            clientes.forEach((c, index) => {
                let pts = calcularPontosValidos(c.historico);
                let opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `${c.nome} (${pts} pts)`;
                select.appendChild(opt);
            });
            select.value = atual;
        }

        function mudarClienteAdmin() {
            let index = document.getElementById('cliente-selecao').value;
            if (index !== "") {
                let c = clientes[index];
                let pts = calcularPontosValidos(c.historico);
                document.getElementById('nome-adm').textContent = c.nome;
                document.getElementById('tel-adm').textContent = c.telefone;
                document.getElementById('pontos-adm').textContent = `${Math.min(pts, 50)} / 50 pts`;
            } else {
                document.getElementById('nome-adm').textContent = "-";
                document.getElementById('tel-adm').textContent = "-";
                document.getElementById('pontos-adm').textContent = "0 / 50 pts";
            }
        }

        function abrirCadastro() {
            let nome = prompt("Nome da nova cliente:");
            if(!nome) return;
            let telefone = prompt("Telefone/WhatsApp da nova cliente:");
            if(!telefone) return;

            let novaCliente = {
                nome: nome.trim(),
                telefone: telefone.trim(),
                historico: [{ pontos: 5, data: Date.now() }] // Já ganha os 5 pts do primeiro atendimento
            };

            clientes.push(novaCliente);
            let novoIndex = clientes.length - 1;

            // Se veio através de indicação via link, bonifica automaticamente quem indicou!
            if (indicadoPor) {
                let quemIndicouObj = clientes.find(c => c.nome.toLowerCase() === decodeURIComponent(indicadoPor).toLowerCase());
                if (quemIndicouObj) {
                    quemIndicouObj.historico.push({ pontos: 5, data: Date.now() });
                    alert(`Sucesso! Nova cliente cadastrada com +5 pts.\nE ${quemIndicouObj.nome} ganhou +5 pts pela indicação!`);
                } else {
                    alert("Cliente cadastrada com sucesso! (Atenção: A pessoa que indicou não foi encontrada exatamente pelo nome no cadastro, verifique se o nome está idêntico).");
                }
            } else {
                alert("Cliente cadastrada com sucesso!");
            }

            localStorage.setItem('mary_clientes_v2', JSON.stringify(clientes));
            atualizarSelect();
            
            // Seleciona automaticamente a nova cliente cadastrada
            document.getElementById('cliente-selecao').value = novoIndex;
            mudarClienteAdmin();
        }

        function registrarAtendimento() {
            let index = document.getElementById('cliente-selecao').value;
            if (index === "") return alert("Selecione uma cliente!");
            
            clientes[index].historico.push({ pontos: 5, data: Date.now() });
            localStorage.setItem('mary_clientes_v2', JSON.stringify(clientes));
            atualizarSelect();
            mudarClienteAdmin();
            alert(`+5 pontos adicionados por atendimento!`);
        }

        function registrarIndicacaoManual() {
            let indexIndicou = document.getElementById('cliente-selecao').value;
            if (indexIndicou === "") return alert("Selecione primeiro a cliente que FEZ a indicação!");

            let clienteIndicouObj = clientes[indexIndicou];
            let nomeNovo = prompt(`Nome da nova cliente indicada por ${clienteIndicouObj.nome}:`);
            if (!nomeNovo) return;
            let telNovo = prompt(`Telefone de ${nomeNovo}:`);
            if (!telNovo) return;

            clientes.push({
                nome: nomeNovo.trim(),
                telefone: telNovo.trim(),
                historico: [{ pontos: 5, data: Date.now() }]
            });

            clientes[indexIndicou].historico.push({ pontos: 5, data: Date.now() });

            localStorage.setItem('mary_clientes_v2', JSON.stringify(clientes));
            atualizarSelect();
            mudarClienteAdmin();

            alert(`Sucesso! \n- ${clienteIndicouObj.nome} ganhou +5 pts pela indicação.\n- ${nomeNovo} foi cadastrada com +5 pts.`);
        }

        function resgatarPontos() {
            let index = document.getElementById('cliente-selecao').value;
            if (index === "") return alert("Selecione uma cliente!");
            
            let c = clientes[index];
            let ptsAtuais = calcularPontosValidos(c.historico);

            if (ptsAtuais <= 0) return alert("Esta cliente não possui pontos válidos para resgate.");

            if (!confirm(`${c.nome} possui ${ptsAtuais} pontos. Deseja realizar o resgate e zerar o ciclo?`)) return;

            clientes[index].historico.path({ pontos: -ptsAtuais, data: Date.now() });
            // Correção de segurança para o método de push do histórico de resgate:
            clientes[index].historico.push({ pontos: -ptsAtuais, data: Date.now() });

            localStorage.setItem('mary_clientes_v2', JSON.stringify(clientes));
            atualizarSelect();
            mudarClienteAdmin();
            alert(`Resgate realizado com sucesso para ${c.nome}!`);
        }

        function enviarWhatsApp() {
            let index = document.getElementById('cliente-selecao').value;
            if (index === "") return alert("Selecione uma cliente!");
            let c = clientes[index];
            
            let ptsTotais = Math.min(calcularPontosValidos(c.historico), 50);
            let baseUrl = window.location.href.replace('admin.html', 'index.html');
            let telLimpo = c.telefone.replace(/\D/g, '');
            let linkCliente = `${baseUrl}?nome=${encodeURIComponent(c.nome)}&pts=${ptsTotais}`;

            let msg = `Olá ${c.nome}! Acompanhe seus pontos do Cartão Fidelidade Designer Estilo Mary aqui: ${linkCliente}`;
            window.open(`https://api.whatsapp.com/send?phone=55${telLimpo}&text=${encodeURIComponent(msg)}`);
        }

        atualizarSelect();
    </script>
</body>
</html>
