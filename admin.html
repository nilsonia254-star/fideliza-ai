<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Designer Estilo Mary</title>
    <style>
        :root { --primary: #c2185b; --primary-dark: #880e4f; --bg-color: #fcf6f7; --white: #ffffff; --success: #2e7d32; }
        body { font-family: sans-serif; background: var(--bg-color); margin: 0; padding: 20px 15px; }
        .wrapper { max-width: 480px; margin: 0 auto; }
        .card { background: var(--white); border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; margin-bottom: 10px; }
        .btn { background: var(--primary); color: var(--white); border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-success { background: var(--success); }
        .btn-secondary { background: #5c6bc0; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1 style="text-align: center; color: var(--primary-dark);">Painel da Mary 🔒</h1>
        
        <div class="card">
            <select id="cliente-selecao" onchange="mudarClienteAdmin()">
                <option value="">Selecione uma cliente...</option>
            </select>
        </div>

        <div class="card">
            <div id="nome-adm" style="font-size: 18px; font-weight: bold; color: var(--primary-dark);">-</div>
            <div id="tel-adm" style="font-size: 13px; color: #666">-</div>
            <div id="pontos-adm" style="font-size: 26px; font-weight: bold; color: var(--primary); margin-top: 5px;">0 / 50 pts</div>
        </div>

        <button class="btn btn-success" onclick="abrirCadastro()">+ Cadastrar Cliente</button>
        <button class="btn" onclick="adicionarPontos(5)">Registrar Atendimento (+5 pts)</button>
        <button class="btn btn-secondary" onclick="adicionarPontos(5)">Indicação Premiada (+5 pts)</button>
        <button class="btn" style="background: #00897b;" onclick="enviarWhatsApp()">📲 Enviar Link</button>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('mary_clientes_v2')) || [];

        function calcularPontosValidos(historico) {
            let limite60Dias = Date.now() - (60 * 24 * 60 * 60 * 1000); // 60 dias em milissegundos
            return historico.filter(r => r.data >= limite60Dias).reduce((acc, r) => acc + r.pontos, 0);
        }

        function atualizarSelect() {
            let select = document.getElementById('cliente-selecao');
            let atual = select.value;
            select.innerHTML = '<option value="">Selecione uma cliente...</option>';
            clientes.forEach((c, index) => {
                let pts = calcularPontosValidos(c.historico);
                let opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `${c.nome} (${pts} pts)`;
                select.appendChild(opt);
            });
            select.value = atual;
        }

        function mudarClienteAdmin() {
            let index = document.getElementById('cliente-selecao').value;
            if (index !== "") {
                let c = clientes[index];
                let pts = calcularPontosValidos(c.historico);
                document.getElementById('nome-adm').textContent = c.nome;
                document.getElementById('tel-adm').textContent = c.telefone;
                document.getElementById('pontos-adm').textContent = `${Math.min(pts, 50)} / 50 pts`;
            }
        }

        function abrirCadastro() {
            let nome = prompt("Nome:");
            if(!nome) return;
            let telefone = prompt("Telefone/WhatsApp:");
            if(!telefone) return;
            clientes.push({ nome: nome, telefone: telefone, historico: [] });
            localStorage.setItem('mary_clientes_v2', JSON.stringify(clientes));
            atualizarSelect();
        }

        function adicionarPontos(qtd) {
            let index = document.getElementById('cliente-selecao').value;
            if (index === "") return alert("Selecione uma cliente!");
            
            clientes[index].historico.push({ pontos: qtd, data: Date.now() });
            localStorage.setItem('mary_clientes_v2', JSON.stringify(clientes));
            atualizarSelect();
            mudarClienteAdmin();
            alert(`+${qtd} pontos! Validade: 60 dias.`);
        }

        function enviarWhatsApp() {
            let index = document.getElementById('cliente-selecao').value;
            if (index === "") return alert("Selecione uma cliente!");
            let c = clientes[index];
            let url = window.location.href.replace('admin.html', 'index.html');
            let msg = `Olá ${c.nome}! Acompanhe seus pontos do Cartão Fidelidade Designer Estilo Mary aqui: ${url}`;
            window.open(`https://api.whatsapp.com/send?phone=55${c.telefone.replace(/\D/g, '')}&text=${encodeURIComponent(msg)}`);
        }

        atualizarSelect();
    </script>
</body>
</html>
