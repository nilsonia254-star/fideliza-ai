<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Mary 🔐</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #221a1f; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; color: #fff; }
        .card { background: #2c2529; border-radius: 20px; padding: 25px; width: 100%; max-width: 440px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); text-align: center; border: 1px solid #ff00ff; box-sizing: border-box; }
        h2 { color: #ff80ff; font-size: 22px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        select, input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #555; border-radius: 10px; font-size: 14px; box-sizing: border-box; background: #3d353a; color: #fff; outline: none; }
        select:focus, input:focus { border-color: #ff80ff; }
        input::placeholder { color: #aaa; }

        .btn { width: 100%; padding: 13px 15px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 10px; color: white; box-sizing: border-box; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { opacity: 0.9; }

        .btn-cadastrar { background: #008000; }
        .btn-atendimento-cinza { background: #3d3d3d; border: 2px solid #00c853; }
        .btn-atendimento-magenta { background: #9c004f; }
        .btn-indicacao { background: #0056b3; }
        .btn-resgatar { background: #ff8000; }
        .btn-excluir { background: #cc0000; }
        .btn-enviar-link { background: #004d40; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Painel da Mary 🔐</h2>
        
        <select id="selectCliente" onchange="carregarDadosCliente()">
            <option value="">Selecione uma cliente...</option>
        </select>

        <input type="text" id="nomeCliente" placeholder="Nome da Cliente">
        <input type="tel" id="whatsappCliente" placeholder="WhatsApp com DDD (Ex: 119...)">

        <button class="btn btn-cadastrar" onclick="cadastrarCliente()">+ Cadastrar Cliente</button>
        <button class="btn btn-atendimento-cinza" onclick="adicionarPontos(3)">🎁 Registrar Atendimento (+3 pts)</button>
        <button class="btn btn-atendimento-magenta" onclick="adicionarPontos(5)">Registrar Atendimento (+5 pts)</button>
        <button class="btn btn-indicacao" onclick="indicacaoManual()">👥 Indicação Manual (Cadastrar Nova)</button>
        <button class="btn btn-resgatar" onclick="resgatarPontos()">🎁 Resgatar / Zerar Pontos</button>
        <button class="btn btn-excluir" onclick="excluirCliente()">🗑️ Excluir Cliente Selecionada</button>
        <button class="btn btn-enviar-link" onclick="enviarLink()">📱 Enviar Link</button>
    </div>

    <script>
        // Procura por qualquer uma das chaves antigas que possam ter sido usadas anteriormente
        function obterChaveStorage() {
            const chavesPossiveis = ['fidelida_clientes', 'clientes', 'fideliza_clientes', 'fideliza_ai_clientes'];
            for (let chave of chavesPossiveis) {
                if (localStorage.getItem(chave)) {
                    return chave;
                }
            }
            return 'fidelida_clientes'; // Padrão se nenhuma for encontrada
        }

        const STORAGE_KEY = obterChaveStorage();
        const PONTOS_PARA_RESGATE = 10;

        document.addEventListener('DOMContentLoaded', carregarClientesNoSelect);

        function obterClientes() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        }

        function salvarClientes(clientes) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(clientes));
        }

        function gerarId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }
