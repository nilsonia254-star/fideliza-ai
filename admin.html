<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Mary 🔐</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fcf6f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .card { background: #ffffff; border-radius: 20px; padding: 25px; width: 100%; max-width: 440px; box-shadow: 0 8px 20px rgba(194, 24, 91, 0.1); text-align: center; border: 1px solid #f8bbd0; box-sizing: border-box; }
        h2 { color: #880e4f; font-size: 22px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        select, input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #f8bbd0; border-radius: 10px; font-size: 14px; box-sizing: border-box; background: #fff; color: #333; outline: none; }
        select:focus, input:focus { border-color: #c2185b; }

        .client-box { background: #fdf2f4; border: 1px solid #f8bbd0; border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: left; display: none; }
        .client-name { font-weight: bold; color: #880e4f; font-size: 16px; margin-bottom: 4px; }
        .client-phone { font-size: 12px; color: #666; margin-bottom: 2px; }
        .client-id { font-size: 11px; color: #888; margin-bottom: 6px; }
        .client-points { font-size: 24px; font-weight: bold; color: #c2185b; margin-top: 5px; }

        .btn { width: 100%; padding: 13px 15px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 10px; color: white; box-sizing: border-box; text-decoration: none; display: inline-block; text-align: center; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }

        .btn-cadastrar { background: #2e7d32; }
        .btn-atendimento { background: #ad1457; }
        .btn-indicacao { background: #1976D2; }
        .btn-resgatar { background: #f57c00; }
        .btn-excluir { background: #c62828; }
        .btn-whatsapp { background: #00695c; }

        .editar-container { background: #fff; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #eee; display: none; }
        .editar-container input { margin-bottom: 6px; }
        .btn-salvar-tel { background: #0288d1; padding: 8px; font-size: 12px; margin-bottom: 0; width: auto; display: inline-block; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Painel da Mary 🔐</h2>

        <!-- Seleção de Clientes -->
        <select id="cliente-selecao" onchange="carregarDadosCliente()">
            <option value="">Selecione uma cliente...</option>
        </select>

        <!-- Caixa de Resumo da Cliente Selecionada -->
        <div class="client-box" id="painel-cliente">
            <div class="client-name" id="info-nome">Nome da Cliente</div>
            <div class="client-phone" id="info-tel">Telefone</div>
            <div class="client-id" id="info-id">ID: </div>
            <div class="client-points" id="info-pts">0 / 50 pts</div>
            
            <button class="btn btn-salvar-tel" onclick="toggleEditarTel()" style="margin-top: 8px;">✏️ Atualizar Telefone</button>
            
            <div class="editar-container" id="box-edita-tel">
                <input type="text" id="novo-tel-cliente" placeholder="Novo WhatsApp com DDD">
                <button class="btn btn-salvar-tel" onclick="salvarNovoTelefone()">Salvar Novo Número</button>
            </div>
        </div>

        <!-- Campos para Cadastrar Nova Cliente -->
        <input type="text" id="novo-nome" placeholder="Nome da Cliente">
        <input type="text" id="novo-tel" placeholder="WhatsApp com DDD (Ex: 119...)">
        
        <!-- OS 6 BOTÕES COMPLETOS -->
        <button class="btn btn-cadastrar" onclick="cadastrarCliente()">+ Cadastrar Cliente</button>
        <button class="btn btn-atendimento" onclick="adicionarPontos(5)">Registrar Atendimento (+5 pts)</button>
        <button class="btn btn-indicacao" onclick="adicionarPontos(5)">Indicação Manual (+5 pts)</button>
        <button class="btn btn-resgatar" onclick="resgatarPontos()">🎁 Resgatar / Zerar Pontos</button>
        <button class="btn btn-excluir" onclick="excluirCliente()">🗑️ Excluir Cliente Selecionada</button>
        <a href="#" id="link-whatsapp" class="btn btn-whatsapp" target="_blank" onclick="verificarSelecao(event)">📱 Enviar Link</a>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('mary_clientes')) || [];

        function salvar() {
            localStorage.setItem('mary_clientes', JSON.stringify(clientes));
        }

        function atualizarSelect() {
            let select = document.getElementById('cliente-selecao');
            let valorAntigo = select.value;
            select.innerHTML = '<option value="">Selecione uma cliente...</option>';
            clientes.forEach((c, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `${c.nome} (${c.pontos || 0} pts)`;
                select.appendChild(opt);
            });
            select.value = valorAntigo;
        }

        function cadastrarCliente() {
            let nome = document.getElementById('novo-nome').value.trim();
            let tel = document.getElementById('novo-tel').value.trim();
            if (!nome || !tel) return alert('Preencha o nome e o telefone!');

            let idFixo = 'mary_' + Date.now();

            clientes.push({ 
                id: idFixo, 
                nome: nome, 
                telefone: tel.replace(/\D/g, ''), 
                pontos: 0 
            });

            salvar();
            atualizarSelect();
            document.getElementById('novo-nome').value = '';
            document.getElementById('novo-tel').value = '';
            alert('Cliente cadastrada com sucesso! 🎉');
        }

        function carregarDadosCliente() {
            let index = document.getElementById('cliente-selecao').value;
            let painel = document.getElementById('painel-cliente');
            document.getElementById('box-edita-tel').style.display = 'none';

            if (index === "") {
                painel.style.display = "none";
                return;
            }

            painel.style.display = "block";
            let c = clientes[index];

            if (!c.id) {
                c.id = 'mary_' + Date.now();
                salvar();
            }

            let pts = c.pontos || 0;

            document.getElementById('info-nome').textContent = c.nome;
            document.getElementById('info-tel').textContent = `WhatsApp: ${c.telefone}`;
            document.getElementById('info-id').textContent = `ID Fixo: ${c.id}`;
            document.getElementById('info-pts').textContent = `${pts} / 50 pts`;
            document.getElementById('novo-tel-cliente').value = c.telefone;

            let baseURL = window.location.href.replace('admin.html', 'index.html');
            let linkCartao = `${baseURL}?nome=${encodeURIComponent(c.nome)}&pts=${pts}&id=${c.id}`;

            let mensagem = `✨ *ESTILO MARY* ✨\n\nOlá ${c.nome}! Seu Cartão Fidelidade Digital está atualizado. 💅\n\nAcesse seu saldo de pontos e indique amigas para ganhar bônus:\n👉 ${linkCartao}`;

            let btnZap = document.getElementById('link-whatsapp');
            btnZap.href = `https://api.whatsapp.com/send?phone=55${c.telefone}&text=${encodeURIComponent(mensagem)}`;
        }

        function toggleEditarTel() {
            let box = document.getElementById('box-edita-tel');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }

        function salvarNovoTelefone() {
            let index = document.getElementById('cliente-selecao').value;
            let novoTel = document.getElementById('novo-tel-cliente').value.trim().replace(/\D/g, '');
            if (index === "" || !novoTel) return alert('Digite um telefone válido!');

            clientes[index].telefone = novoTel;
            salvar();
            carregarDadosCliente();
            atualizarSelect();
            alert('Telefone atualizado com sucesso! O ID e os pontos foram preservados. ✨');
        }

        function adicionarPontos(qtd) {
            let index = document.getElementById('cliente-selecao').value;
            if (index === "") return alert('Selecione uma cliente primeiro!');
            clientes[index].pontos = Math.min((clientes[index].pontos || 0) + qtd, 50);
            salvar();
            carregarDadosCliente();
            atualizarSelect();
            alert(`Adicionado ${qtd} pontos com sucesso! ✨`);
        }

        function resgatarPontos() {
            let index = document.getElementById('cliente-selecao').value;
            if (index === "") return alert('Selecione uma cliente primeiro!');
            if (confirm("Deseja resgatar os benefícios e zerar os pontos desta cliente?")) {
                clientes[index].pontos = 0;
                salvar();
                carregarDadosCliente();
                atualizarSelect();
                alert("Pontos zerados para um novo ciclo! 🎁");
            }
        }

        function excluirCliente() {
            let index = document.getElementById('cliente-selecao').value;
            if (index === "") return alert('Selecione uma cliente primeiro!');
            if (confirm("Tem certeza que deseja excluir esta cliente?")) {
                clientes.splice(index, 1);
                salvar();
                atualizarSelect();
                document.getElementById('painel-cliente').style.display = "none";
                alert("Cliente excluída!");
            }
        }

        function verificarSelecao(e) {
            let index = document.getElementById('cliente-selecao').value;
            if (index === "") {
                e.preventDefault();
                alert('Selecione uma cliente primeiro para enviar o link!');
            }
        }

        atualizarSelect();
    </script>
</body>
</html>
