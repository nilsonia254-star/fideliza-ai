<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Estilo Mary</title>
    <style>
        :root { --primary: #c2185b; --bg-color: #fcf6f7; --white: #ffffff; --success: #2e7d32; }
        body { font-family: sans-serif; background: var(--bg-color); display: flex; justify-content: center; padding: 20px; }
        .card { background: var(--white); border-radius: 16px; padding: 25px; width: 100%; max-width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); box-sizing: border-box; }
        h2 { color: #880e4f; text-align: center; margin-bottom: 20px; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; background: #fff; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-whatsapp { background: #25D366; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; }
        .client-info { background: #fdf2f4; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 13px; color: #444; border-left: 3px solid var(--primary); }
    </style>
</head>
<body>
    <div class="card">
        <h2>✨ Painel Estilo Mary ✨</h2>

        <div class="form-group">
            <label>Selecione a Cliente:</label>
            <select id="cliente-selecao" onchange="carregarDadosCliente()">
                <option value="">-- Escolha uma cliente --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Ou Cadastrar Nova Cliente:</label>
            <input type="text" id="novo-nome" placeholder="Nome da Cliente">
        </div>
        <div class="form-group">
            <input type="text" id="novo-tel" placeholder="WhatsApp (com DDD)">
        </div>
        <button class="btn-primary" onclick="cadastrarCliente()">➕ Cadastrar Cliente</button>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <div id="painel-cliente" style="display:none;">
            <div class="client-info" id="resumo-cliente"></div>

            <div class="form-group" style="margin-top: 15px;">
                <label>Adicionar Pontos / Procedimento:</label>
                <input type="number" id="pontos-adicionar" placeholder="Ex: 5 ou 10" value="5">
            </div>
            <button class="btn-primary" onclick="adicionarPontos()">✨ Adicionar Pontos</button>

            <!-- Botão para enviar o link correto do cartão via WhatsApp -->
            <button class="btn-whatsapp" onclick="enviarWhatsApp()" style="margin-top: 15px;">💬 Enviar Cartão no WhatsApp</button>
        </div>
    </div>

    <script>
        // Banco de dados simulado no navegador (localStorage)
        let clientes = JSON.parse(localStorage.getItem('mary_clientes')) || [];

        function salvarNoLocalStorage() {
            localStorage.setItem('mary_clientes', JSON.stringify(clientes));
        }

        function atualizarSelect() {
            let select = document.getElementById('cliente-selecao');
            select.innerHTML = '<option value="">-- Escolha uma cliente --</option>';
            clientes.forEach((c, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `${c.nome} (${c.telefone})`;
                select.appendChild(opt);
            });
        }

        function cadastrarCliente() {
            let nome = document.getElementById('novo-nome').value.trim();
            let tel = document.getElementById('novo-tel').value.trim();

            if (!nome || !tel) {
                alert('Por favor, preencha o nome e o telefone da cliente!');
                return;
            }

            clientes.push({ nome: nome, telefone: tel, historico: [] });
            salvarNoLocalStorage();
            atualizarSelect();

            document.getElementById('novo-nome').value = '';
            document.getElementById('novo-tel').value = '';
            alert('Cliente cadastrada com sucesso! 🎉');
        }

        function calcularPontosValidos(historico) {
            let agora = new Date().getTime();
            let pontosTotais = 0;
            historico.forEach(h => {
                let dataRegistro = new Date(h.data).getTime();
                let diasPassados = (agora - dataRegistro) / (1000 * 60 * 60 * 24);
                // Pontos válidos por 60 dias
                if (diasPassados <= 60) {
                    pontosTotais += h.pts;
                }
            });
            return pontosTotais;
        }

        function carregarDadosCliente() {
            let index = document.getElementById('cliente-selecao').value;
            let painel = document.getElementById('painel-cliente');

            if (index === "") {
                painel.style.display = "none";
                return;
            }

            painel.style.display = "block";
            let c = clientes[index];
            let ptsTotais = Math.min(calcularPontosValidos(c.historico), 50);

            document.getElementById('resumo-cliente').innerHTML = `
                <b>Cliente:</b> ${c.nome}<br>
                <b>Telefone:</b> ${c.telefone}<br>
                <b>Pontos Atuais:</b> <span style="color: #c2185b; font-weight: bold; font-size: 15px;">${ptsTotais} pts</span> (válidos)
            `;
        }

        function adicionarPontos() {
            let index = document.getElementById('cliente-selecao').value;
            let qtd = parseInt(document.getElementById('pontos-adicionar').value);

            if (isNaN(qtd) || qtd <= 0) {
                alert('Digite uma quantidade válida de pontos!');
                return;
            }

            clientes[index].historico.push({ pts: qtd, data: new Date().toISOString() });
            salvarNoLocalStorage();
            carregarDadosCliente();
            alert(`${qtd} pontos adicionados com sucesso! ✨`);
        }

        function enviarWhatsApp() {
            let index = document.getElementById('cliente-selecao').value;
            if (index === "") return alert("Selecione uma cliente!");
            let c = clientes[index];
            
            let ptsTotais = Math.min(calcularPontosValidos(c.historico), 50);
            let telLimpo = c.telefone.replace(/\D/g, '');
            
            // LINK FIXO APONTANDO EXATAMENTE PARA O INDEX.HTML DO SEU CARTÃO
            let linkCliente = `https://nilsonia254-star.github.io/fideliza-ai/index.html?nome=${encodeURIComponent(c.nome)}&pts=${ptsTotais}`;

            // Mensagem comercial organizada
            let msg = `✨ *DESIGNER ESTILO MARY* ✨\n\nOlá ${c.nome}! Seu Cartão Fidelidade foi atualizado. 💅\n\nAcesse seu saldo de pontos, confira nosso endereço e agende seu próximo horário por hier:\n👉 ${linkCliente}`;
            
            window.open(`https://api.whatsapp.com/send?phone=55${telLimpo}&text=${encodeURIComponent(msg)}`);
        }

        // Inicializa a lista ao carregar a página
        atualizarSelect();
    </script>
</body>
</html>
