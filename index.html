<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Estilo Mary - Cartão Fidelidade Digital</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --primary-color: #ff2a85;
            --text-color: #ffffff;
            --text-muted: #b0b0b0;
            --border-color: #ff2a85;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(255, 42, 133, 0.15);
            box-sizing: border-box;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            color: var(--primary-color);
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .header p {
            font-size: 13px;
            color: var(--primary-color);
            margin: 0 0 20px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .client-info {
            background-color: #1f1f1f;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        .client-info h2 {
            font-size: 15px;
            margin: 0 0 8px 0;
            color: var(--text-color);
        }

        .client-info p {
            font-size: 14px;
            margin: 0;
            color: var(--text-muted);
        }

        .client-info span {
            color: var(--primary-color);
            font-weight: bold;
        }

        .grid-points {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .point-box {
            background-color: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: var(--primary-color);
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .point-box.active {
            background-color: rgba(255, 42, 133, 0.15);
            box-shadow: 0 0 10px rgba(255, 42, 133, 0.3);
        }

        .info-studio {
            background-color: #1a1a1a;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 12px;
            color: var(--text-muted);
            border: 1px solid #333;
        }

        .info-studio p {
            margin: 5px 0;
        }

        .info-studio strong {
            color: var(--text-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            margin-bottom: 12px;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }

        .btn-whatsapp {
            background-color: #198754;
        }

        .btn-referral {
            background-color: #0d6efd;
        }

        .btn:hover {
            opacity: 0.9;
        }

            font-size: 11px;
