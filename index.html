  <script>
        // Banco simulado para testes (Depois será integrado ao Google Sheets via n8n)
        let baseClientes = [
            { nome: "Mariana", telefone: "11988881111", telFormatado: "(11) 98888-1111", pontos: 15, ultimaAtualizacao: new Date() },
            { nome: "Juliana Silva", telefone: "11977772222", telFormatado: "(11) 97777-2222", pontos: 10, ultimaAtualizacao: new Date() },
            { nome: "Camila Souza", telefone: "11966663333", telFormatado: "(11) 96666-3333", pontos: 25, ultimaAtualizacao: new Date() }
        ];

        function limparNumero(tel) {
            if (!tel) return '';
            return tel.toString().replace(/\D/g, ''); // Remove tudo que não for número
        }

        function consultarPontos() {
            let inputVal = document.getElementById("telefone-busca").value;
            let numeroBuscado = limparNumero(inputVal);
            const msgErro = document.getElementById("msg-erro");

            if (!numeroBuscado) {
                msgErro.innerText = "Por favor, digite o número de telefone.";
                return;
            }

            // Procura o cliente limpando os números de ambas as pontas
            let clienteEncontrada = baseClientes.find(c => limparNumero(c.telefone) === numeroBuscado);

            if (clienteEncontrada) {
                msgErro.innerText = "";
                document.getElementById("box-busca").style.display = "none";
                document.getElementById("box-resultado").style.display = "block";

                document.getElementById("res-nome").innerText = clienteEncontrada.nome;
                document.getElementById("res-tel").innerText = clienteEncontrada.telFormatado || clienteEncontrada.telefone;
                document.getElementById("res-pontos").innerText = clienteEncontrada.pontos;
            } else {
                msgErro.innerText = "Número não encontrado. Verifique se digitou corretamente ou consulte a Mary.";
            }
        }

        function voltarBusca() {
            document.getElementById("box-resultado").style.display = "none";
            document.getElementById("box-busca").style.display = "block";
            document.getElementById("telefone-busca").value = "";
            document.getElementById("msg-erro").innerText = "";
        }
    </script>
