<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão Fidelidade - Designer Estilo Mary</title>
    <style>
        :root { --primary: #c2185b; --bg-color: #fcf6f7; --white: #ffffff; --success: #2e7d32; }
        body { font-family: sans-serif; background: var(--bg-color); display: flex; justify-content: center; padding: 20px; }
        .card { background: var(--white); border-radius: 16px; padding: 25px; text-align: center; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .pts { font-size: 42px; font-weight: bold; color: var(--primary); margin: 10px 0; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }
        .stamp { aspect-ratio: 1; border-radius: 50%; background: #f1f1f1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #aaa; border: 2px dashed #ddd; }
        .stamp.active { background: #fce4ec; color: var(--primary); border: 2px solid var(--primary); }
        .btn-zap { background: #25D366; color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn-agendar { background: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; }
        .address-box { background: #fdf2f4; border-radius: 8px; padding: 12px; margin-top: 20px; font-size: 12px; color: #555; text-align: left; border-left: 3px solid var(--primary); line-height: 1.4; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #880e4f; margin-bottom: 5px;">✨ Designer Estilo Mary ✨</h2>
        <div id="nome-cliente" style="color: #440022; font-size: 16px; font-weight: bold; margin-bottom: 15px;">Seu Cartão Fidelidade</div>
        
        <div class="pts" id="total-pontos">0 pts</div>
        <p style="font-size: 12px; color: #888; margin-top: 0;">Pontos válidos por 60 dias.</p>
        
        <div class="grid" id="cartao-selos"></div>

        <!-- Botão para a cliente indicar amigas -->
        <button class="btn-zap" onclick="compartilharIndicacao()">🎁 Indicar Amiga e Ganhar Pontos</button>

        <!-- Endereço do Salão -->
        <div class="address-box">
            <b>📍 Local de Atendimento:</b><br>
            Rua Nova Aliança, nº 2B<br>
            <i>(Travessa da Agostiniana Chantal)</i><br>
            Bairro: Jd. Nova Conquista
        </div>

        <!-- Botão para agendar horário direto no WhatsApp do Salão -->
        <a href="#" id="link-agendamento" class="btn-agendar" target="_blank">📅 Agendar Horário no WhatsApp</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const nomeCliente = urlParams.get('nome');
        const pontosCliente = parseInt(urlParams.get('pts')) || 0;

        let clienteNomeExibicao = nomeCliente ? decodeURIComponent(nomeCliente) : "Cliente";

        if (nomeCliente) {
            document.getElementById('nome-cliente').textContent = `Olá, ${clienteNomeExibicao}!`;
        }

        document.getElementById('total-pontos').textContent = `${pontosCliente} pts`;

        let grid = document.getElementById('cartao-selos');
        let selosAtivos = Math.floor(pontosCliente / 5);

        for (let i = 1; i <= 10; i++) {
            let div = document.createElement('div');
            div.className = `stamp ${i <= selosAtivos ? 'active' : ''}`;
            div.textContent = i <= selosAtivos ? '✔' : i * 5;
            grid.appendChild(div);
        }

        // COLOQUE AQUI O NÚMERO DO WHATSAPP DO SEU SALÃO (com DDD e 55 na frente)
        // Exemplo: '5511999999999'
        const numeroWhatsAppSalao = '5511999999999'; 

        let textoAgendamento = `Olá Mary! Vim pelo meu cartão fidelidade e gostaria de agendar um horário. Meu nome é ${clienteNomeExibicao}.`;
        document.getElementById('link-agendamento').href = `https://api.whatsapp.com/send?phone=${numeroWhatsAppSalao}&text=${encodeURIComponent(textoAgendamento)}`;

        function compartilharIndicacao() {
            let baseUrl = window.location.href.split('?')[0];
            let linkIndicacao = `${baseUrl}?indicadoPor=${encodeURIComponent(clienteNomeExibicao)}`;

            let mensagem = `Amiga, olha que legal esse cartão fidelidade da Designer Estilo Mary! 💖 Se você fizer um procedimento lá usando minha indicação, nós duas ganhamos pontos! Dá uma olhada no meu cartão: ${linkIndicacao}`;
            
            let urlZap = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`;
            window.open(urlZap, '_blank');
        }
    </script>
</body>
</html>
