<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Estilo Mary - Fidelidade</title>
    <style>
        :root {
            --primary: #c2185b;
            --primary-dark: #880e4f;
            --primary-light: #fce4ec;
            --bg-color: #fcf6f7;
            --text-main: #2d2d2d;
            --text-muted: #666;
            --white: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--primary-dark);
            margin-bottom: 5px;
            font-size: 24px;
        }
        p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }
        .card {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid #f0e6e8;
        }
        .btn {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: var(--primary-dark);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Designer Estilo Mary ✨</h1>
            <p>Seu Cartão Fidelidade Digital</p>
        </header>

        <div class="card">
            <h3>Consultar Meus Pontos</h3>
            <p>Digite seu telefone para ver seu saldo atual.</p>
            <!-- Lógica de consulta virá aqui -->
        </div>
    </div>

    <script>
        // Scripts do painel do cliente
    </script>
</body>
</html>
